name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fixed debug key so every build installs as an update over the previous one.
      # Skipped (default debug key) when the secrets are not configured, e.g. on forks.
      - name: Decode fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using fixed debug keystore from repository secrets."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; APK is signed with a throwaway debug key and will not install over previous builds."
          fi

      - name: Unit tests and debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "phone-focus-debug-${{ github.run_number }}.apk"

      # archive: false uploads the bare .apk (no zip), so the phone can install it directly.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: phone-focus-debug-${{ github.run_number }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
